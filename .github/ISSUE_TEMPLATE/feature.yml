name: Feature request
description: Suggest an improvement or a new capability for the skill.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, including doing nothing.
    validations:
      required: false
  - type: dropdown
    id: tool
    attributes:
      label: AI tool
      description: The tool this mostly matters for.
      options:
        - Claude Code
        - Codex CLI
        - Gemini CLI
        - Other
        - All of them
    validations:
      required: false
