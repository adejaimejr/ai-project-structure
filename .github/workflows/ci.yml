name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Validate structure (strict)
        run: python3 docs/skills/ai-project-structure/scripts/validate_structure.py . --strict

      - name: Verify repository
        run: python3 docs/skills/ai-project-structure/evals/verify_repository.py

  # Lints the workflows themselves. A bad expression (runner.temp in a job-level
  # env) once made release.yml unparseable, and nothing here caught it.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint workflows
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c
          tar -xzf "$tarball" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # Single status check named "ci" for the main ruleset: matrix checks carry an
  # "(os)" suffix, so this job aggregates them (and actionlint) under one stable name.
  ci:
    name: ci
    needs: [gates, actionlint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job did not succeed
        env:
          GATES_RESULT: ${{ needs.gates.result }}
          ACTIONLINT_RESULT: ${{ needs.actionlint.result }}
        run: |
          echo "gates result: $GATES_RESULT; actionlint result: $ACTIONLINT_RESULT"
          test "$GATES_RESULT" = "success"
          test "$ACTIONLINT_RESULT" = "success"
