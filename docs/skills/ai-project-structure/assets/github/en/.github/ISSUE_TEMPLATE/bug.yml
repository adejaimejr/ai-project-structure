name: Bug report
description: Something does not work as expected.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or commit you are using.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Linux, macOS or Windows"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact commands or actions that lead to the problem.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: What actually happened. Paste the full output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true
